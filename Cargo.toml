[workspace]
resolver = "2"
members = ["crates/cullr-core", "crates/cullr-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Cullr contributors"]

[workspace.dependencies]
eframe = "0.36"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
rawler = "=0.7.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
md-5 = "0.10"
tempfile = "3"
crossbeam-channel = "0.5"
dirs = "6"
rfd = "0.15"
rayon = "1.10"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = "deny"
perf = "deny"
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "deny"
needless_collect = "deny"

[profile.release]
lto = "thin"

# Dev builds stay unoptimized for fast iteration, but the heavy lifting is
# all in dependencies (JPEG decode, RAW extraction): left at opt-level 0,
# one 1920x1280 loupe decode takes ~1 s and preview browsing is unusable.
# Optimizing just the dependency tree keeps workspace compile times low
# while making `cargo run` usable for real culling sessions.
[profile.dev.package."*"]
opt-level = 2
