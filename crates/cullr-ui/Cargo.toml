[package]
name = "cullr-ui"
description = "Cullr — Photo Mechanic-style culling tool for RAW photographs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cullr-core = { path = "../cullr-core" }
# "persistence" lets eframe save/restore the window rect across restarts
# (with monitor clamping) and the egui memory; see main.rs.
eframe = { workspace = true, features = ["persistence"] }
image.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
rfd.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
